name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows x64 ──
          - platform: windows-x64
            os: windows-latest
            exe-suffix: .exe
          # ── Linux x64 ──
          - platform: linux-x64
            os: ubuntu-latest
            exe-suffix: ""
          # ── macOS ARM64 (Apple Silicon) ──
          - platform: macos-arm64
            os: macos-latest
            exe-suffix: ""
          # ── Linux ARM64 (native ARM runner) ──
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            exe-suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Compile server
        run: dart build cli -t bin/wenzagent_server.dart -o build/wenzagent_server

      - name: Compile client
        run: dart build cli -t bin/wenzagent_client.dart -o build/wenzagent_client

      - name: Prepare package files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg\config
          Copy-Item -Path build\wenzagent_server\bundle\bin\* -Destination pkg\
          Copy-Item -Path build\wenzagent_client\bundle\bin\* -Destination pkg\
          Copy-Item -Path build\wenzagent_server\bundle\lib\* -Destination pkg\ -ErrorAction SilentlyContinue
          Copy-Item -Path build\wenzagent_client\bundle\lib\* -Destination pkg\ -ErrorAction SilentlyContinue
          Copy-Item -Path doc\RELEASE_README.md -Destination pkg\README.md
          Copy-Item -Path config\wenzagent_server.yaml.example -Destination pkg\config\
          Copy-Item -Path config\wenzagent_client.yaml.example -Destination pkg\config\

      - name: Prepare package files (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p pkg/config
          cp build/wenzagent_server/bundle/bin/* pkg/
          cp build/wenzagent_client/bundle/bin/* pkg/
          cp build/wenzagent_server/bundle/lib/* pkg/ 2>/dev/null || true
          cp build/wenzagent_client/bundle/lib/* pkg/ 2>/dev/null || true
          cp doc/RELEASE_README.md pkg/README.md
          cp config/wenzagent_server.yaml.example pkg/config/
          cp config/wenzagent_client.yaml.example pkg/config/

      - name: Package artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path pkg/* -DestinationPath dist/wenzagent-${{ matrix.platform }}.zip

      - name: Package artifacts (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar czf dist/wenzagent-${{ matrix.platform }}.tar.gz -C pkg .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wenzagent-${{ matrix.platform }}
          path: dist/*
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
